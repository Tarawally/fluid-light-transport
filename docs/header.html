<!-- Theme Synchronisation for Embedded Demos -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Listen for Quarto theme changes
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.type === 'attributes' && mutation.attributeName === 'dataset') {
        syncTheme();
      }
      // Quarto often toggles 'quarto-light' / 'quarto-dark' on body
      if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
        syncTheme();
      }
    });
  });

  observer.observe(document.body, { attributes: true });

  function syncTheme() {
    const isDark = document.body.classList.contains('quarto-dark') || 
                   document.body.getAttribute('data-mode') === 'dark';
    const theme = isDark ? 'dark' : 'light';
    
    // Send to all iframes
    const iframes = document.querySelectorAll('iframe');
    iframes.forEach(iframe => {
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'themechange', theme: theme }, '*');
      }
    });
  }

  // Handle iframe resize messages
  window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'resize' && event.data.height) {
      // Find the iframe that sent the message and adjust if needed
      // (Simplified: we let the CSS vh handle most cases for now)
    }
  });

  // Initial sync once iframe loads
  window.addEventListener('load', syncTheme);
});
</script>
