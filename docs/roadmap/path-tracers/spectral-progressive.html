<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stochastic Monte Carlo spectral global illumination renderer utilising procedural sphere tracing and a quad-ary bounding volume hierarchy</title>
  <style>
    body {
      align-items: center;
      background: #050505;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      font-family: monospace;
      height: 100vh;
      justify-content: center;
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      height: 100%;
      width: 100%;
    }

    #rendering-pipeline-telemetry {
      backdrop-filter: blur(8px);
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      left: 20px;
      padding: 20px;
      pointer-events: none;
      position: absolute;
      top: 20px;
      z-index: 10;
    }

    .telemetry-variable-value {
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }

    .telemetry-variable-identifier {
      color: #888;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.2px;
      margin-bottom: 2px;
      margin-top: 10px;
      text-transform: uppercase;
    }

    #input-event-listener-instructions {
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid #333;
      border-radius: 8px;
      bottom: 20px;
      color: #aaa;
      font-size: 12px;
      left: 50%;
      padding: 10px 20px;
      pointer-events: none;
      position: absolute;
      transform: translateX(-50%);
      z-index: 10;
    }

    #runtime-exception-stack-trace {
      background: #110000;
      border: 1px solid #ff4444;
      color: #ff4444;
      display: none;
      max-width: 80%;
      padding: 20px;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="rendering-pipeline-telemetry">
    <div class="telemetry-variable-identifier">Format</div>
    <div class="telemetry-variable-value">fp32 (anchored)</div>
    <div class="telemetry-variable-identifier">Sampling</div>
    <div class="telemetry-variable-value">Spectral MIS</div>
    <div class="telemetry-variable-identifier">Acceleration</div>
    <div class="telemetry-variable-value">SDF BVH4 (fp16)</div>
    <div class="telemetry-variable-identifier">Reprojection</div>
    <div class="telemetry-variable-value">Analytic Disocclusion</div>
    <div class="telemetry-variable-identifier">Temporal State</div>
    <div id="temporal-accumulation-counter" class="telemetry-variable-value">Accumulating</div>
  </div>

  <div id="input-event-listener-instructions">
    Click to lock pointer. WASD to move. QE to elevate.
  </div>
  
  <div id="runtime-exception-stack-trace">
    WebGPU context null: verify driver.
  </div>
  
  <canvas id="webgpu-swapchain-canvas"></canvas>

  <script type="module">
    /**
     * @fileoverview Hardware-accelerated stochastic global illumination framework.
     * Implements a procedural signed distance field architecture. Bounding volume
     * hierarchy ensures targeted raymarching.
     */

    const COMPUTE_SHADER_PAYLOAD = `
      struct GlobalPipelineParameters {
        frame_width: f32,
        frame_height: f32,
        render_iteration: u32,
        entropy_nonce: u32,
        
        view_right: vec3<f32>,      camera_moving: f32,
        view_up: vec3<f32>,         padding_2: f32,
        view_forward: vec3<f32>,    padding_3: f32,
        cam_pos: vec3<f32>,         padding_4: f32,
        
        prev_right: vec3<f32>,      padding_5: f32,
        prev_up: vec3<f32>,         padding_6: f32,
        prev_forward: vec3<f32>,    padding_7: f32,
        prev_cam_pos: vec3<f32>,    padding_8: f32,
      };

      struct BvhNode4 {
        min_x: vec2<u32>,
        max_x: vec2<u32>,
        min_y: vec2<u32>,
        max_y: vec2<u32>,
        min_z: vec2<u32>,
        max_z: vec2<u32>,
        child_data: vec4<u32>, 
      };

      struct ProceduralPrimitive {
        pos_type: vec4<f32>,
        col_emit: vec4<f32>,
        params: vec4<f32>,
        padding: vec4<f32>,
      };

      struct SdfResult {
        dist: f32,
        mat_idx: u32,
        colour: vec3<f32>,
        emittance: f32,
      };

      @group(0) @binding(0) var<uniform> global_params: GlobalPipelineParameters;
      @group(0) @binding(1) var acc_radiance_read: texture_2d<f32>;
      @group(0) @binding(2) var acc_radiance_write: texture_storage_2d<rgba32float, write>;
      @group(0) @binding(3) var<storage, read> bvh_tree: array<BvhNode4>;
      @group(0) @binding(4) var<storage, read> geometry_array: array<ProceduralPrimitive>;

      var<private> prng_state: u32;

      fn pcg_hash() -> u32 {
        let state = prng_state * 747796405u + 2891336453u;
        let word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
        prng_state = (word >> 22u) ^ word;
        return prng_state;
      }

      fn rand_f32() -> f32 {
        return f32(pcg_hash()) / 4294967296.0;
      }

      fn roberts_r2(n: u32) -> vec2<f32> {
        let g = 1.32471795724474602596;
        return fract(vec2<f32>(0.5) + vec2<f32>(f32(n) / g, f32(n) / (g * g)));
      }

      fn eval_gaussian_spectra(lambda: vec4<f32>, peak: f32, std_dev: f32) -> vec4<f32> {
        let diff = (lambda - vec4<f32>(peak)) / std_dev;
        return exp(-0.5 * (diff * diff));
      }

      fn wavelength_to_xyz(lambda: f32) -> vec3<f32> {
        let x = exp(-0.5 * pow((lambda - 599.8) / 37.9, 2.0)) * 1.097 + exp(-0.5 * pow((lambda - 442.0) / 16.0, 2.0)) * 0.377;
        let y = exp(-0.5 * pow((lambda - 568.8) / 46.9, 2.0)) * 1.014;
        let z = exp(-0.5 * pow((lambda - 437.0) / 11.8, 2.0)) * 3.980;
        return vec3<f32>(x, y, z);
      }

      fn sample_history_reprojection(uv: vec2<f32>, dim: vec2<f32>, current_mat: u32, is_moving: f32) -> vec4<f32> {
        let pos = uv * dim - 0.5;
        let pos_i = vec2<i32>(floor(pos));
        let f = fract(pos);

        let dim_i = vec2<i32>(dim);
        let p00 = clamp(pos_i, vec2<i32>(0), dim_i - vec2<i32>(1));
        let p10 = clamp(pos_i + vec2<i32>(1, 0), vec2<i32>(0), dim_i - vec2<i32>(1));
        let p01 = clamp(pos_i + vec2<i32>(0, 1), vec2<i32>(0), dim_i - vec2<i32>(1));
        let p11 = clamp(pos_i + vec2<i32>(1, 1), vec2<i32>(0), dim_i - vec2<i32>(1));

        let t00 = textureLoad(acc_radiance_read, p00, 0);
        let t10 = textureLoad(acc_radiance_read, p10, 0);
        let t01 = textureLoad(acc_radiance_read, p01, 0);
        let t11 = textureLoad(acc_radiance_read, p11, 0);

        let p00_u32 = bitcast<u32>(t00.a);
        let m00 = p00_u32 >> 16u;
        let a00 = f32(p00_u32 & 0xFFFFu);

        let p10_u32 = bitcast<u32>(t10.a);
        let m10 = p10_u32 >> 16u;
        let a10 = f32(p10_u32 & 0xFFFFu);

        let p01_u32 = bitcast<u32>(t01.a);
        let m01 = p01_u32 >> 16u;
        let a01 = f32(p01_u32 & 0xFFFFu);

        let p11_u32 = bitcast<u32>(t11.a);
        let m11 = p11_u32 >> 16u;
        let a11 = f32(p11_u32 & 0xFFFFu);

        var w00 = (1.0 - f.x) * (1.0 - f.y);
        var w10 = f.x * (1.0 - f.y);
        var w01 = (1.0 - f.x) * f.y;
        var w11 = f.x * f.y;

        if (is_moving > 0.5) {
            if (m00 != current_mat) { w00 = 0.0; }
            if (m10 != current_mat) { w10 = 0.0; }
            if (m01 != current_mat) { w01 = 0.0; }
            if (m11 != current_mat) { w11 = 0.0; }
        }

        let sum_w = w00 + w10 + w01 + w11;

        if (sum_w < 0.001) {
            return vec4<f32>(0.0);
        }

        w00 /= sum_w; w10 /= sum_w; w01 /= sum_w; w11 /= sum_w;

        let rgb = t00.rgb * w00 + t10.rgb * w10 + t01.rgb * w01 + t11.rgb * w11;
        let acc = a00 * w00 + a10 * w10 + a01 * w01 + a11 * w11;

        return vec4<f32>(rgb, acc);
      }

      struct Ray {
        origin: vec3<f32>,
        dir: vec3<f32>,
        inv_dir: vec3<f32>,
      };

      struct HitPayload {
        dist: f32,
        pos: vec3<f32>,
        normal: vec3<f32>,
        colour: vec3<f32>,
        emittance: f32,
        radius: f32,
        valid: bool,
        mat_idx: u32,
      };

      fn op_smooth_union(d1: SdfResult, d2: SdfResult, k: f32) -> SdfResult {
        let h = clamp(0.5 + 0.5 * (d2.dist - d1.dist) / k, 0.0, 1.0);
        var res: SdfResult;
        res.dist = mix(d2.dist, d1.dist, h) - k * h * (1.0 - h);
        res.colour = mix(d2.colour, d1.colour, h);
        res.emittance = mix(d2.emittance, d1.emittance, h);
        res.mat_idx = select(d2.mat_idx, d1.mat_idx, d1.dist < d2.dist);
        return res;
      }

      fn eval_primitive(p: vec3<f32>, prim: ProceduralPrimitive) -> f32 {
        let typ = u32(prim.pos_type.w);
        let local_p = p - prim.pos_type.xyz;
        
        if (typ == 0u) {
            return length(local_p) - prim.params.x;
        } else if (typ == 1u) {
            let q = abs(local_p) - prim.params.xyz;
            return length(max(q, vec3<f32>(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0);
        } else if (typ == 2u) {
            let q = vec2<f32>(length(local_p.xz) - prim.params.x, local_p.y);
            return length(q) - prim.params.y;
        } else if (typ == 3u) {
            let h = clamp(local_p.y / prim.params.y, 0.0, 1.0);
            return length(local_p - vec3<f32>(0.0, h * prim.params.y, 0.0)) - prim.params.x;
        }
        return 1e30;
      }

      fn map_domain(p: vec3<f32>, domain_idx: u32) -> SdfResult {
        if (domain_idx == 0u) {
            var d: SdfResult;
            d.dist = eval_primitive(p, geometry_array[0]);
            d.mat_idx = 0u;
            d.colour = geometry_array[0].col_emit.xyz;
            d.emittance = geometry_array[0].col_emit.w;
            return d;
        } else if (domain_idx == 1u) {
            var d1: SdfResult; d1.dist = eval_primitive(p, geometry_array[1]); d1.mat_idx = 1u; d1.colour = geometry_array[1].col_emit.xyz; d1.emittance = geometry_array[1].col_emit.w;
            var d2: SdfResult; d2.dist = eval_primitive(p, geometry_array[2]); d2.mat_idx = 2u; d2.colour = geometry_array[2].col_emit.xyz; d2.emittance = geometry_array[2].col_emit.w;
            var d3: SdfResult; d3.dist = eval_primitive(p, geometry_array[3]); d3.mat_idx = 3u; d3.colour = geometry_array[3].col_emit.xyz; d3.emittance = geometry_array[3].col_emit.w;
            
            var res = d1;
            if (d2.dist < res.dist) { res = d2; }
            if (d3.dist < res.dist) { res = d3; }
            return res;
        } else if (domain_idx == 4u) {
            var d: SdfResult;
            d.dist = eval_primitive(p, geometry_array[4]);
            d.mat_idx = 4u;
            d.colour = geometry_array[4].col_emit.xyz;
            d.emittance = geometry_array[4].col_emit.w;
            return d;
        }
        var miss: SdfResult; miss.dist = 1e30; return miss;
      }

      fn calc_normal(p: vec3<f32>, domain_idx: u32) -> vec3<f32> {
        let h = 0.0005;
        let k = vec2<f32>(1.0, -1.0);
        return normalize(
            k.xyy * map_domain(p + k.xyy * h, domain_idx).dist +
            k.yyx * map_domain(p + k.yyx * h, domain_idx).dist +
            k.yxy * map_domain(p + k.yxy * h, domain_idx).dist +
            k.xxx * map_domain(p + k.xxx * h, domain_idx).dist
        );
      }

      fn traverse_sdf(ray: Ray, t_min: f32, t_max: f32, domain_idx: u32) -> HitPayload {
        var t = max(0.0, t_min);
        var res: SdfResult;
        var hit: HitPayload;
        hit.valid = false;
        hit.dist = 1e30;

        for (var i = 0u; i < 96u; i++) {
          let p = ray.origin + ray.dir * t;
          res = map_domain(p, domain_idx);

          if (res.dist < 0.001) {
            hit.dist = t;
            hit.pos = p;
            hit.colour = res.colour;
            hit.emittance = res.emittance;
            hit.valid = true;
            hit.mat_idx = res.mat_idx;
            hit.radius = geometry_array[res.mat_idx].params.x;
            hit.normal = calc_normal(p, domain_idx);
            break;
          }

          t += res.dist;
          if (t > t_max) { break; }
        }
        return hit;
      }

      fn traverse_wide_bvh(ray: Ray) -> HitPayload {
        var payload: HitPayload;
        payload.dist = 1e30;
        payload.valid = false;

        var stack: array<u32, 8>;
        var ptr: u32 = 0u;
        var safety_counter: u32 = 0u;
        stack[0] = 0u;

        while (ptr != 0xFFFFFFFFu && safety_counter < 64u) {
          safety_counter++;
          let node_idx = stack[ptr];
          ptr--;
          let node = bvh_tree[node_idx];

          let min_x = vec4<f32>(unpack2x16float(node.min_x.x), unpack2x16float(node.min_x.y));
          let max_x = vec4<f32>(unpack2x16float(node.max_x.x), unpack2x16float(node.max_x.y));
          let min_y = vec4<f32>(unpack2x16float(node.min_y.x), unpack2x16float(node.min_y.y));
          let max_y = vec4<f32>(unpack2x16float(node.max_y.x), unpack2x16float(node.max_y.y));
          let min_z = vec4<f32>(unpack2x16float(node.min_z.x), unpack2x16float(node.min_z.y));
          let max_z = vec4<f32>(unpack2x16float(node.max_z.x), unpack2x16float(node.max_z.y));

          let t0x = (min_x - ray.origin.x) * ray.inv_dir.x;
          let t1x = (max_x - ray.origin.x) * ray.inv_dir.x;
          let tmin_x = min(t0x, t1x); let tmax_x = max(t0x, t1x);

          let t0y = (min_y - ray.origin.y) * ray.inv_dir.y;
          let t1y = (max_y - ray.origin.y) * ray.inv_dir.y;
          let tmin_y = min(t0y, t1y); let tmax_y = max(t0y, t1y);

          let t0z = (min_z - ray.origin.z) * ray.inv_dir.z;
          let t1z = (max_z - ray.origin.z) * ray.inv_dir.z;
          let tmin_z = min(t0z, t1z); let tmax_z = max(t0z, t1z);

          let tnear = max(max(tmin_x, tmin_y), tmin_z);
          let tfar = min(min(tmax_x, tmax_y), tmax_z);

          let valid_box = vec4<u32>(
            select(0u, 1u, tnear.x <= tfar.x && tfar.x >= 0.0),
            select(0u, 1u, tnear.y <= tfar.y && tfar.y >= 0.0),
            select(0u, 1u, tnear.z <= tfar.z && tfar.z >= 0.0),
            select(0u, 1u, tnear.w <= tfar.w && tfar.w >= 0.0)
          );

          for (var i = 0u; i < 4u; i++) {
            if (valid_box[i] == 1u) {
              let child_raw = node.child_data[i];
              if (child_raw != 0xFFFFFFFFu) {
                let is_leaf = (child_raw & 0x80000000u) != 0u;
                let idx = child_raw & 0x7FFFFFFFu;

                if (is_leaf) {
                  var t_n: f32; var t_f: f32;
                  if (i == 0u) { t_n = tnear.x; t_f = tfar.x; }
                  else if (i == 1u) { t_n = tnear.y; t_f = tfar.y; }
                  else if (i == 2u) { t_n = tnear.z; t_f = tfar.z; }
                  else { t_n = tnear.w; t_f = tfar.w; }

                  let sdf_hit = traverse_sdf(ray, t_n, t_f, idx);
                  if (sdf_hit.valid && sdf_hit.dist < payload.dist) {
                    payload = sdf_hit;
                  }
                } else {
                  ptr++;
                  stack[ptr] = idx;
                }
              }
            }
          }
        }
        return payload;
      }

      fn traverse_sdf_shadow(ray: Ray, t_min: f32, t_max: f32, domain_idx: u32) -> bool {
        var t = max(0.0, t_min);
        for (var i = 0u; i < 64u; i++) {
          let p = ray.origin + ray.dir * t;
          let res = map_domain(p, domain_idx);
          if (res.dist < 0.001) { return true; }
          t += res.dist;
          if (t > t_max) { break; }
        }
        return false;
      }

      fn traverse_wide_bvh_shadow(ray: Ray, light_dist: f32) -> bool {
        var stack: array<u32, 8>;
        var ptr: u32 = 0u;
        var safety_counter: u32 = 0u;
        stack[0] = 0u;

        while (ptr != 0xFFFFFFFFu && safety_counter < 64u) {
          safety_counter++;
          let node_idx = stack[ptr];
          ptr--;
          let node = bvh_tree[node_idx];

          let min_x = vec4<f32>(unpack2x16float(node.min_x.x), unpack2x16float(node.min_x.y));
          let max_x = vec4<f32>(unpack2x16float(node.max_x.x), unpack2x16float(node.max_x.y));
          let min_y = vec4<f32>(unpack2x16float(node.min_y.x), unpack2x16float(node.min_y.y));
          let max_y = vec4<f32>(unpack2x16float(node.max_y.x), unpack2x16float(node.max_y.y));
          let min_z = vec4<f32>(unpack2x16float(node.min_z.x), unpack2x16float(node.min_z.y));
          let max_z = vec4<f32>(unpack2x16float(node.max_z.x), unpack2x16float(node.max_z.y));

          let t0x = (min_x - ray.origin.x) * ray.inv_dir.x;
          let t1x = (max_x - ray.origin.x) * ray.inv_dir.x;
          let tmin_x = min(t0x, t1x); let tmax_x = max(t0x, t1x);

          let t0y = (min_y - ray.origin.y) * ray.inv_dir.y;
          let t1y = (max_y - ray.origin.y) * ray.inv_dir.y;
          let tmin_y = min(t0y, t1y); let tmax_y = max(t0y, t1y);

          let t0z = (min_z - ray.origin.z) * ray.inv_dir.z;
          let t1z = (max_z - ray.origin.z) * ray.inv_dir.z;
          let tmin_z = min(t0z, t1z); let tmax_z = max(t0z, t1z);

          let tnear = max(max(tmin_x, tmin_y), tmin_z);
          let tfar = min(min(tmax_x, tmax_y), tmax_z);

          let valid_box = vec4<u32>(
            select(0u, 1u, tnear.x <= tfar.x && tfar.x >= 0.0),
            select(0u, 1u, tnear.y <= tfar.y && tfar.y >= 0.0),
            select(0u, 1u, tnear.z <= tfar.z && tfar.z >= 0.0),
            select(0u, 1u, tnear.w <= tfar.w && tfar.w >= 0.0)
          );

          for (var i = 0u; i < 4u; i++) {
            if (valid_box[i] == 1u) {
              let child_raw = node.child_data[i];
              if (child_raw != 0xFFFFFFFFu) {
                let is_leaf = (child_raw & 0x80000000u) != 0u;
                let idx = child_raw & 0x7FFFFFFFu;

                if (is_leaf) {
                  if (idx != 4u) { 
                    var t_n: f32; var t_f: f32;
                    if (i == 0u) { t_n = tnear.x; t_f = tfar.x; }
                    else if (i == 1u) { t_n = tnear.y; t_f = tfar.y; }
                    else if (i == 2u) { t_n = tnear.z; t_f = tfar.z; }
                    else { t_n = tnear.w; t_f = tfar.w; }

                    if (traverse_sdf_shadow(ray, t_n, min(t_f, light_dist), idx)) {
                      return true;
                    }
                  }
                } else {
                  ptr++;
                  stack[ptr] = idx;
                }
              }
            }
          }
        }
        return false;
      }

      /* Casts a virtual ray from the previous camera frame to mathematically prove if a world point was visible */
      fn is_historically_occluded(unjittered_pos: vec3<f32>, target_mat: u32) -> bool {
        let prev_cam_view_space = global_params.prev_cam_pos - global_params.cam_pos;
        let to_pos = unjittered_pos - prev_cam_view_space;
        let dist = length(to_pos);
        let dir = to_pos / dist;
        
        var v_ray: Ray;
        v_ray.origin = prev_cam_view_space;
        v_ray.dir = dir;
        v_ray.inv_dir = select(1.0 / v_ray.dir, vec3<f32>(1e30), abs(v_ray.dir) < vec3<f32>(1e-8));
        
        let hit = traverse_wide_bvh(v_ray);
        
        /* Distance tolerance is increased slightly to permit sphere tracing inaccuracies */
        if (!hit.valid) { return true; }
        if (hit.mat_idx != target_mat) { return true; }
        if (abs(hit.dist - dist) > 0.25) { return true; }
        
        return false;
      }

      fn cosine_hemisphere(n: vec3<f32>, u: vec2<f32>) -> vec3<f32> {
        let r = sqrt(u.x);
        let theta = 6.28318530718 * u.y;
        let z = sqrt(max(0.0, 1.0 - u.x));
        let up = select(vec3<f32>(1.0, 0.0, 0.0), vec3<f32>(0.0, 1.0, 0.0), abs(n.x) > 0.99);
        let t = normalize(cross(up, n));
        let b = cross(n, t);
        return normalize(t * (r * cos(theta)) + b * (r * sin(theta)) + n * z);
      }

      fn blackbody(lambda_nm: vec4<f32>, T: f32) -> vec4<f32> {
        let l = lambda_nm * 1e-9;
        let c1 = 3.74177e-16;
        let c2 = 1.43878e-2;
        let p5 = l * l * l * l * l;
        let exp_term = exp(vec4<f32>(c2 / T) / l);
        let rad = vec4<f32>(c1) / (p5 * (exp_term - vec4<f32>(1.0)));
        
        let l_ref = 560.0 * 1e-9;
        let rad_ref = c1 / (pow(l_ref, 5.0) * (exp(c2 / (l_ref * T)) - 1.0));
        return rad / vec4<f32>(rad_ref);
      }

      @compute @workgroup_size(8, 8)
      fn pt_main(@builtin(global_invocation_id) tid: vec3<u32>) {
        if (f32(tid.x) >= global_params.frame_width || f32(tid.y) >= global_params.frame_height) { 
          return; 
        }

        let pixel = tid.xy;
        prng_state = pixel.x * 1973u + pixel.y * 9277u + global_params.render_iteration * 26699u + global_params.entropy_nonce;
        pcg_hash(); 
        
        let qmc = roberts_r2(global_params.render_iteration);
        let jitter = fract(vec2<f32>(rand_f32(), rand_f32()) + qmc);
        
        let ndc = (vec2<f32>(pixel) + jitter) / vec2<f32>(global_params.frame_width, global_params.frame_height);
        let aspect = global_params.frame_width / global_params.frame_height;
        let proj_uv = (ndc * 2.0 - 1.0) * vec2<f32>(aspect, -1.0);
        
        var ray: Ray;
        ray.origin = vec3<f32>(0.0);
        ray.dir = normalize(global_params.view_forward * 1.5 + 
                            global_params.view_right * (proj_uv.x * 0.75) + 
                            global_params.view_up * (proj_uv.y * 0.75));
        ray.inv_dir = select(1.0 / ray.dir, vec3<f32>(1e30), abs(ray.dir) < vec3<f32>(1e-8));
        
        let base_w = 380.0 + rand_f32() * 100.0;
        let w = vec4<f32>(base_w, base_w + 100.0, base_w + 200.0, base_w + 300.0);
        
        var tp = vec4<f32>(1.0);
        var rad = vec4<f32>(0.0);
        var primary_hit: HitPayload;
        
        var prev_pdf_brdf = 1.0;
        var prev_bounce_specular = true;

        for (var depth = 0; depth < 8; depth++) {
          let hit = traverse_wide_bvh(ray);
          if (depth == 0) { primary_hit = hit; }

          if (!hit.valid) {
            let rayleigh = vec4<f32>(25000000000.0) / (w * w * w * w);
            let sky = mix(vec4<f32>(0.0), rayleigh * 0.15, ray.dir.y * 0.5 + 0.5);
            rad += tp * sky; 
            break;
          }
          
          if (hit.emittance > 0.0) {
            if (depth == 0 || prev_bounce_specular) {
              let d65_emission = blackbody(w, 6504.0);
              let visible_emittance = min(hit.emittance, 3.0);
              rad += tp * vec4<f32>(visible_emittance) * d65_emission;
            } else {
              let d65_emission = blackbody(w, 6504.0);
              let light_area = 4.0 * 3.14159265 * hit.radius * hit.radius;
              let cos_light = max(0.0, dot(hit.normal, -ray.dir));
              let dist_sq = hit.dist * hit.dist;
              let pdf_light_sa = (1.0 / light_area) * (dist_sq / max(0.0001, cos_light));
              let mis_weight = prev_pdf_brdf / max(1e-8, prev_pdf_brdf + pdf_light_sa);
              rad += tp * vec4<f32>(hit.emittance) * d65_emission * mis_weight;
            }
            break; 
          }

          let l_r1 = rand_f32();
          let l_r2 = rand_f32();
          let l_z = 1.0 - 2.0 * l_r1;
          let l_rad = sqrt(max(0.0, 1.0 - l_z * l_z));
          let l_phi = 6.28318530718 * l_r2;
          let light_r = geometry_array[4].params.x;
          let light_pos = geometry_array[4].pos_type.xyz + vec3<f32>(l_rad * cos(l_phi), l_rad * sin(l_phi), l_z) * light_r;
          
          let to_light = light_pos - hit.pos;
          let light_dist = length(to_light);
          let l_dir = to_light / light_dist;
          
          var shadow_ray: Ray;
          shadow_ray.origin = hit.pos + hit.normal * 0.001;
          shadow_ray.dir = l_dir;
          shadow_ray.inv_dir = select(1.0 / l_dir, vec3<f32>(1e30), abs(l_dir) < vec3<f32>(1e-8));
          
          let is_occluded = traverse_wide_bvh_shadow(shadow_ray, light_dist);
          
          let b_c = eval_gaussian_spectra(w, 450.0, 20.0);
          let g_c = eval_gaussian_spectra(w, 540.0, 25.0);
          let r_c = eval_gaussian_spectra(w, 650.0, 30.0);
          let refl = clamp(hit.colour.r * r_c + hit.colour.g * g_c + hit.colour.b * b_c, vec4<f32>(0.0), vec4<f32>(1.0));

          let F0 = vec4<f32>(0.04);
          let cos_theta_v = max(0.0, dot(-ray.dir, hit.normal));
          var F = F0 + (vec4<f32>(1.0) - F0) * pow(1.0 - cos_theta_v, 5.0);
          
          if (hit.mat_idx == 0u) {
              F = vec4<f32>(0.0);
          }

          if (!is_occluded) {
             let d65_emission = blackbody(w, 6504.0);
             let s_emittance = geometry_array[4].col_emit.w * d65_emission;
             
             let n_dot_l = max(0.0, dot(hit.normal, l_dir));
             let light_normal = normalize(light_pos - geometry_array[4].pos_type.xyz);
             let cos_light = max(0.0, dot(light_normal, -l_dir));
             
             let light_area = 4.0 * 3.14159265 * light_r * light_r;
             let pdf_light_area = 1.0 / light_area;
             let solid_angle_weight = cos_light / max(0.0001, light_dist * light_dist);
             let pdf_light_sa = pdf_light_area / max(0.00001, solid_angle_weight);
             
             let pdf_brdf = n_dot_l / 3.14159265;
             let mis_weight = pdf_light_sa / max(1e-8, pdf_light_sa + pdf_brdf);
             
             let brdf_val = 1.0 / 3.14159265;
             let direct_contrib = (s_emittance * n_dot_l * brdf_val) / pdf_light_sa;
             rad += tp * refl * (vec4<f32>(1.0) - F) * direct_contrib * mis_weight;
          }

          let prob_spec = f32((F.x + F.y + F.z + F.w) * 0.25);
          if (rand_f32() < prob_spec) {
              ray.dir = reflect(ray.dir, hit.normal);
              ray.origin = hit.pos + hit.normal * 0.001;
              ray.inv_dir = select(1.0 / ray.dir, vec3<f32>(1e30), abs(ray.dir) < vec3<f32>(1e-8));
              tp *= F / max(0.0001, prob_spec);
              prev_bounce_specular = true;
              prev_pdf_brdf = 1.0;
          } else {
              let next_dir = cosine_hemisphere(hit.normal, fract(vec2<f32>(rand_f32(), rand_f32()) + qmc));
              ray.dir = next_dir;
              ray.origin = hit.pos + hit.normal * 0.001;
              ray.inv_dir = select(1.0 / ray.dir, vec3<f32>(1e30), abs(ray.dir) < vec3<f32>(1e-8));
              tp *= refl * (vec4<f32>(1.0) - F) / max(0.0001, 1.0 - prob_spec);
              prev_bounce_specular = false;
              prev_pdf_brdf = max(0.0, dot(hit.normal, next_dir)) / 3.14159265;
          }

          if (depth >= 2) {
              let max_tp = max(max(tp.r, tp.g), max(tp.b, tp.a));
              let rr_prob = clamp(max_tp, 0.1, 0.95);
              if (rand_f32() > rr_prob) { break; }
              tp *= 1.0 / rr_prob;
          }
        }
        
        var xyz = vec3<f32>(0.0);
        for(var i=0u; i<4u; i++) {
           xyz += rad[i] * wavelength_to_xyz(w[i]);
        }
        
        let norm_factor = 400.0 / (4.0 * 106.8);
        xyz = xyz * norm_factor;
        
        if (any(xyz != xyz) || any(xyz > vec3<f32>(100000.0))) {
            xyz = vec3<f32>(0.0);
        }
        xyz = clamp(xyz, vec3<f32>(0.0), vec3<f32>(12.0));
        
        var current_mat = 100u;
        var unjittered_pos = vec3<f32>(0.0);
        
        if (primary_hit.valid) {
            current_mat = primary_hit.mat_idx;
        }

        var prev_uv = vec2<f32>(-1.0);
        var force_history_reset = false;

        if (global_params.camera_moving > 0.5) {
            let center_ndc = (vec2<f32>(pixel) + 0.5) / vec2<f32>(global_params.frame_width, global_params.frame_height);
            let center_proj = (center_ndc * 2.0 - 1.0) * vec2<f32>(aspect, -1.0);
            let center_dir = normalize(global_params.view_forward * 1.5 + 
                                       global_params.view_right * (center_proj.x * 0.75) + 
                                       global_params.view_up * (center_proj.y * 0.75));
            
            unjittered_pos = center_dir * primary_hit.dist;
            let to_prev = select(center_dir, unjittered_pos + global_params.cam_pos - global_params.prev_cam_pos, primary_hit.valid);
            
            let p_z = dot(to_prev, global_params.prev_forward);
            
            if (p_z > 0.0) {
                let p_x = dot(to_prev, global_params.prev_right);
                let p_y = dot(to_prev, global_params.prev_up);

                let proj_uv_x = p_x / (p_z * 0.5);
                let proj_uv_y = p_y / (p_z * 0.5);

                let uv_x = (proj_uv_x / aspect + 1.0) * 0.5;
                let uv_y = (-proj_uv_y + 1.0) * 0.5;

                prev_uv = vec2<f32>(uv_x, uv_y);
                
                /* Analytical geometric validation guarantees the point was visible in the previous frame */
                if (primary_hit.valid && is_historically_occluded(unjittered_pos, current_mat)) {
                    force_history_reset = true;
                }
            }
        } else {
            prev_uv = (vec2<f32>(pixel) + 0.5) / vec2<f32>(global_params.frame_width, global_params.frame_height);
        }

        var acc_count = 1.0;
        var temporal_weight = 1.0;
        var hist_xyz = vec3<f32>(0.0);

        if (global_params.render_iteration > 0u && !force_history_reset) {
            if (prev_uv.x >= 0.0 && prev_uv.x <= 1.0 && prev_uv.y >= 0.0 && prev_uv.y <= 1.0) {
                let dim = vec2<f32>(global_params.frame_width, global_params.frame_height);
                let hist_data = sample_history_reprojection(prev_uv, dim, current_mat, global_params.camera_moving);
                
                if (hist_data.a > 0.0) {
                    hist_xyz = hist_data.rgb;
                    let hist_acc = hist_data.a;

                    let max_acc = select(65535.0, 3.0, global_params.camera_moving > 0.5);
                    acc_count = min(hist_acc + 1.0, max_acc);
                    temporal_weight = 1.0 / acc_count;
                }
            }
        }
        
        let final_xyz = mix(hist_xyz, xyz, temporal_weight);
        
        let acc_u32 = u32(acc_count);
        let packed_u32 = (current_mat << 16u) | (acc_u32 & 0xFFFFu);
        let packed_f32 = bitcast<f32>(packed_u32);
        
        textureStore(acc_radiance_write, pixel, vec4<f32>(final_xyz, packed_f32));
      }
    `;

    const RASTERISATION_SHADER_PAYLOAD = `
      @group(0) @binding(0) var rad_buffer: texture_2d<f32>;

      struct VSOut {
        @builtin(position) pos: vec4<f32>,
        @location(0) uv: vec2<f32>,
      };

      @vertex
      fn vs_main(@builtin(vertex_index) id: u32) -> VSOut {
        var quad = array<vec2<f32>, 4>(vec2<f32>(-1.0, -1.0), vec2<f32>(1.0, -1.0), vec2<f32>(-1.0, 1.0), vec2<f32>(1.0, 1.0));
        var out: VSOut;
        out.pos = vec4<f32>(quad[id], 0.0, 1.0);
        out.uv = quad[id] * 0.5 + 0.5;
        out.uv.y = 1.0 - out.uv.y;
        return out;
      }

      @fragment
      fn fs_main(in: VSOut) -> @location(0) vec4<f32> {
        let dim = vec2<f32>(textureDimensions(rad_buffer));
        let coord = vec2<i32>(in.uv * dim);

        let center_data = textureLoad(rad_buffer, coord, 0);
        let center_xyz = center_data.rgb;
        
        let center_u32 = bitcast<u32>(center_data.a);
        let center_mat = center_u32 >> 16u;
        let acc_count = f32(center_u32 & 0xFFFFu);

        var sum_xyz = vec3<f32>(0.0);
        var sum_weight = 0.0;
        let center_lum = dot(center_xyz, vec3<f32>(0.2126, 0.7152, 0.0722));

        let filter_strength = clamp(1.0 - (acc_count / 1024.0), 0.0, 1.0);

        if (filter_strength > 0.0) {
          let radius = 2;
          let noise_tolerance = pow(filter_strength, 2.0) * 8.0 + 0.05;

          for (var y = -radius; y <= radius; y++) {
            for (var x = -radius; x <= radius; x++) {
              let offset = vec2<i32>(x, y);
              let sample_coord = clamp(coord + offset, vec2<i32>(0), vec2<i32>(dim) - vec2<i32>(1));
              
              let sample_data = textureLoad(rad_buffer, sample_coord, 0);
              let sample_u32 = bitcast<u32>(sample_data.a);
              let sample_mat = sample_u32 >> 16u;

              let sample_xyz = sample_data.rgb;
              let sample_lum = dot(sample_xyz, vec3<f32>(0.2126, 0.7152, 0.0722));

              let spatial_w = exp(-f32(x*x + y*y) / 4.0);
              let lum_w = exp(-abs(center_lum - sample_lum) / noise_tolerance);
              let w = spatial_w * lum_w;

              sum_xyz += sample_xyz * w;
              sum_weight += w;
            }
          }
        } else {
          sum_xyz = center_xyz;
          sum_weight = 1.0;
        }

        let filtered_xyz = sum_xyz / max(0.0001, sum_weight);
        let xyz = mix(center_xyz, filtered_xyz, filter_strength);
        
        let r = xyz.x * 3.2404542 + xyz.y * -1.5371385 + xyz.z * -0.4985314;
        let g = xyz.x * -0.9692660 + xyz.y * 1.8760108 + xyz.z * 0.0415560;
        let b = xyz.x * 0.0556434 + xyz.y * -0.2040259 + xyz.z * 1.0572252;
        let lrgb = max(vec3<f32>(0.0), vec3<f32>(r, g, b));
        
        let f = (lrgb * (2.51 * lrgb + 0.03)) / (lrgb * (2.43 * lrgb + 0.59) + 0.14);
        return vec4<f32>(pow(max(vec3<f32>(0.0), f), vec3<f32>(0.4545)), 1.0);
      }
    `;

    function toHalf(val) {
      const float32View = new Float32Array([val]);
      const int32View = new Int32Array(float32View.buffer)[0];
      const sign = (int32View >> 16) & 0x8000;
      const absoluteValue = Math.abs(val);

      if (absoluteValue === 0) {
        return sign;
      }
      if (absoluteValue > 65504) {
        return sign | 0x7bff;
      }

      const exponent = ((int32View >> 23) & 0xff) - 127 + 15;
      const mantissa = int32View & 0x007fffff;

      if (exponent <= 0) {
        return sign;
      }
      return sign | (exponent << 10) | (mantissa >> 13);
    }

    function pack2x16(v1, v2) {
      return ((toHalf(v1) & 0xFFFF) | ((toHalf(v2) & 0xFFFF) << 16)) >>> 0;
    }

    function buildDynamicBvh(cameraPosition, bvhUint32) {
      const cx = cameraPosition[0];
      const cy = cameraPosition[1];
      const cz = cameraPosition[2];
      const p = 0.5;

      const s0MinX = -1000 - cx, s0MinY = -2001.5 - cy, s0MinZ = -1005 - cz;
      const s0MaxX = 1000 - cx, s0MaxY = -1.5 - cy, s0MaxZ = 995 - cz;

      const s1MinX = -4.5 - cx - p, s1MinY = -1.5 - cy - p, s1MinZ = -7.0 - cz - p;
      const s1MaxX = 4.5 - cx + p, s1MaxY = 2.5 - cy + p, s1MaxZ = -3.0 - cz + p;

      const s4MinX = -2.5 - cx - p, s4MinY = 6.0 - cy - p, s4MinZ = -7.5 - cz - p;
      const s4MaxX = 2.5 - cx + p, s4MaxY = 11.0 - cy + p, s4MaxZ = -2.5 - cz + p;

      const p16 = pack2x16;

      bvhUint32[0] = p16(s0MinX, s1MinX);
      bvhUint32[1] = p16(s4MinX, 0);
      bvhUint32[2] = p16(s0MaxX, s1MaxX);
      bvhUint32[3] = p16(s4MaxX, 0);

      bvhUint32[4] = p16(s0MinY, s1MinY);
      bvhUint32[5] = p16(s4MinY, 0);
      bvhUint32[6] = p16(s0MaxY, s1MaxY);
      bvhUint32[7] = p16(s4MaxY, 0);

      bvhUint32[8] = p16(s0MinZ, s1MinZ);
      bvhUint32[9] = p16(s4MinZ, 0);
      bvhUint32[10] = p16(s0MaxZ, s1MaxZ);
      bvhUint32[11] = p16(s4MaxZ, 0);

      bvhUint32[12] = 0x80000000 >>> 0;
      bvhUint32[13] = 0x80000001 >>> 0;
      bvhUint32[14] = 0x80000004 >>> 0;
      bvhUint32[15] = 0xFFFFFFFF >>> 0;
    }

      function loop() {

        }

        for (let i = 0; i < 5; i++) {
          geometryData[i * 16 + 0] = primitives[i][0] - cameraPosition[0];
          geometryData[i * 16 + 1] = primitives[i][1] - cameraPosition[1];
          geometryData[i * 16 + 2] = primitives[i][2] - cameraPosition[2];
          geometryData[i * 16 + 3] = primitives[i][3];
          geometryData[i * 16 + 4] = primitives[i][4];
          geometryData[i * 16 + 5] = primitives[i][5];
          geometryData[i * 16 + 6] = primitives[i][6];
          geometryData[i * 16 + 7] = primitives[i][7];
          geometryData[i * 16 + 8] = primitives[i][8];
          geometryData[i * 16 + 9] = primitives[i][9];
          geometryData[i * 16 + 10] = primitives[i][10];
          geometryData[i * 16 + 11] = primitives[i][11];
        }
        device.queue.writeBuffer(geometryBuffer, 0, geometryData);

        buildDynamicBvh(cameraPosition, bvhUint32);
        device.queue.writeBuffer(bvhBuffer, 0, bvhData);

        const readId = iteration % 2;
        const writeId = (iteration + 1) % 2;

        float32View[0] = canvas.width;
        float32View[1] = canvas.height;
        uint32View[2] = iteration;
        uint32View[3] = Math.floor(Math.random() * 1000000);

        float32View[4] = right[0];
        float32View[5] = right[1];
        float32View[6] = right[2];
        float32View[7] = (moving || isDirty) ? 1.0 : 0.0;
        
        float32View[8] = up[0];
        float32View[9] = up[1];
        float32View[10] = up[2];
        
        float32View[12] = forward[0];
        float32View[13] = forward[1];
        float32View[14] = forward[2];
        
        float32View[16] = cameraPosition[0];
        float32View[17] = cameraPosition[1];
        float32View[18] = cameraPosition[2];

        float32View[20] = previousRight[0];
        float32View[21] = previousRight[1];
        float32View[22] = previousRight[2];
        
        float32View[24] = previousUp[0];
        float32View[25] = previousUp[1];
        float32View[26] = previousUp[2];
        
        float32View[28] = previousForward[0];
        float32View[29] = previousForward[1];
        float32View[30] = previousForward[2];
        
        float32View[32] = previousCamera[0];
        float32View[33] = previousCamera[1];
        float32View[34] = previousCamera[2];

        device.queue.writeBuffer(uniformBuffer, 0, uniformDataArray);

        const encoder = device.createCommandEncoder();
        const computePass = encoder.beginComputePass();
        computePass.setPipeline(computePipeline);
        computePass.setBindGroup(0, device.createBindGroup({
          layout: computePipeline.getBindGroupLayout(0),
          entries: [
            { binding: 0, resource: { buffer: uniformBuffer } },
            { binding: 1, resource: radianceBuffers[readId].createView() },
            { binding: 2, resource: radianceBuffers[writeId].createView() },
            { binding: 3, resource: { buffer: bvhBuffer } },
            { binding: 4, resource: { buffer: geometryBuffer } },
          ],
        }));
        computePass.dispatchWorkgroups(Math.ceil(canvas.width / 8), Math.ceil(canvas.height / 8));
        computePass.end();

        const renderPass = encoder.beginRenderPass({
          colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
            loadOp: 'clear',
            storeOp: 'store',
          }],
        });
        renderPass.setPipeline(renderPipeline);
        renderPass.setBindGroup(0, device.createBindGroup({
          layout: renderPipeline.getBindGroupLayout(0),
          entries: [{ binding: 0, resource: radianceBuffers[writeId].createView() }],
        }));
        renderPass.draw(4);
        renderPass.end();

        device.queue.submit([encoder.finish()]);

        if (telemetryNode) {
          telemetryNode.innerText = moving || isDirty ? 'Reprojecting' : 'Accumulating';
        }

        if (moving || isDirty) {
          isDirty = false;
        }

        iteration++;
        previousRight = [...right];
        previousUp = [...up];
        previousForward = [...forward];
        previousCamera = [...cameraPosition];

        requestAnimationFrame(loop);
      }
      loop();
    }
    window.addEventListener('load', initialiseComputePipeline);
  </script>
</body>
</html>
