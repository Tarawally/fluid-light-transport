<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU 128-bit Fixed-Point Path Tracer v14.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000;
      color: #a0a0a0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      margin: 0;
    }

    #framebuffer-surface {
      cursor: crosshair;
      display: block;
      height: 100vh;
      width: 100vw;
      touch-action: none;
    }

    .viewport-allocation {
      height: 100vh;
      width: 100vw;
      background-color: #000;
      overflow: hidden;
      position: relative;
    }

    .compositing-layer {
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .input-mapping-legend {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 0.6rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      color: #71717a;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="viewport-allocation">
    <canvas id="framebuffer-surface"></canvas>
    
    <div class="absolute top-8 left-8 pointer-events-none select-none">
      <h1 class="text-white text-xs font-mono tracking-widest uppercase opacity-40 mb-1">Path tracer iteration 14.1 • maximum viewport allocation</h1>
      <div class="flex items-center space-x-2">
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
        <span id="metric-spp" class="text-emerald-400 font-mono text-sm tracking-tighter">Accumulated samples per pixel: 0</span>
      </div>
    </div>

    <div class="input-mapping-legend font-mono uppercase tracking-tighter text-zinc-400">
      Translation mapping: w, a, s, d • rotation mapping: arrow keys • vertical translation: space, shift • orbital rotation: pointer drag
    </div>

    <div id="exception-overlay" class="absolute inset-0 z-50 flex items-center justify-center p-8 compositing-layer hidden">
      <div class="max-w-md text-center">
        <div class="text-rose-500 mb-4 font-mono text-xl">Runtime exception</div>
        <h2 class="text-white text-lg font-medium mb-2">Render pipeline terminated</h2>
        <p id="exception-stack-trace" class="text-zinc-500 text-sm leading-relaxed font-mono"></p>
      </div>
    </div>
  </div>

  <script type="module">
    /**
     * WebGpuPathTracingRenderer v14.1
     */
    class WebGpuPathTracingRenderer {
      constructor(canvasSurface) {
        this.canvasSurface = canvasSurface;
        this.renderingContext = canvasSurface.getContext('webgpu');
        this.logicalDevice = null;
        this.textureFormat = navigator.gpu?.getPreferredCanvasFormat();
        
        this.accumulationTextures = [];
        this.frameIterationCount = 0;
        
        this.uniformBuffer = null;
        this.directedAcyclicGraphBuffer = null;
        this.fluidSimulationBuffer = null;
        this.exposureBuffer = null;

        this.computeShaderPipeline = null;
        this.rasterisationPipeline = null;
        this.computeBindGroupLayout = null;
        this.rasterisationBindGroupLayout = null;

        this.cameraParameters = {
          position: { x: 0, y: 2, z: 8 },
          rotation: { azimuthal: 0, polar: 0 },
          isMatrixDirty: false
        };

        this.inputState = {
          keyVector: {},
          pointer: { isActive: false, previousCoordinateX: 0, previousCoordinateY: 0 }
        };
        
        this.exceptionOverlay = document.getElementById('exception-overlay');
        this.exceptionStackTrace = document.getElementById('exception-stack-trace');
        this.metricSpp = document.getElementById('metric-spp');

        this.#initialiseInputListeners();
      }

      #initialiseInputListeners() {
        window.addEventListener('keydown', event => { this.inputState.keyVector[event.code] = true; });
        window.addEventListener('keyup', event => { this.inputState.keyVector[event.code] = false; });
        this.canvasSurface.addEventListener('mousedown', event => {
          this.inputState.pointer.isActive = true;
          this.inputState.pointer.previousCoordinateX = event.clientX;
          this.inputState.pointer.previousCoordinateY = event.clientY;
        });
        window.addEventListener('mouseup', () => { this.inputState.pointer.isActive = false; });
        window.addEventListener('mousemove', event => {
          if (!this.inputState.pointer.isActive) return;
          const deltaX = event.clientX - this.inputState.pointer.previousCoordinateX;
          const deltaY = event.clientY - this.inputState.pointer.previousCoordinateY;
          this.cameraParameters.rotation.azimuthal -= deltaX * 0.004;
          this.cameraParameters.rotation.polar = Math.max(-1.5, Math.min(1.5, this.cameraParameters.rotation.polar - deltaY * 0.004));
          this.inputState.pointer.previousCoordinateX = event.clientX;
          this.inputState.pointer.previousCoordinateY = event.clientY;
          this.cameraParameters.isMatrixDirty = true;
        });

        window.addEventListener('resize', () => {
          this.#allocateFramebufferMemory();
          this.#initialiseDeviceResources();
          this.frameIterationCount = 0;
        });
      }

      async initialiseGraphicsContext() {
        if (!navigator.gpu) {
          this.#throwPipelineException("webgpu api unsupported by the current user agent");
          return;
        }

        try {
          const adapter = await navigator.gpu.requestAdapter();
          this.logicalDevice = await adapter.requestDevice();
          this.#allocateFramebufferMemory();
          await this.#initialiseDeviceResources();
          await this.#compileShaderPipelines();
          requestAnimationFrame((timestamp) => this.#executeRenderPass(timestamp));
        } catch (error) {
          this.#throwPipelineException(error.message);
        }
      }

      #allocateFramebufferMemory() {
        const devicePixelRatio = window.devicePixelRatio || 1;
        this.canvasSurface.width = window.innerWidth * devicePixelRatio;
        this.canvasSurface.height = window.innerHeight * devicePixelRatio;
        this.renderingContext.configure({
          device: this.logicalDevice,
          format: this.textureFormat,
          alphaMode: 'premultiplied',
        });
      }

      async #initialiseDeviceResources() {
        const textureDescriptor = {
          size: [this.canvasSurface.width, this.canvasSurface.height],
          format: 'rgba32float',
          usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING
        };
        
        if (this.accumulationTextures.length > 0) {
          this.accumulationTextures.forEach(texture => texture.destroy());
        }

        this.accumulationTextures = [
          this.logicalDevice.createTexture(textureDescriptor),
          this.logicalDevice.createTexture(textureDescriptor)
        ];

        if (!this.uniformBuffer) {
          this.uniformBuffer = this.logicalDevice.createBuffer({
            size: 256,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
          });

          this.directedAcyclicGraphBuffer = this.logicalDevice.createBuffer({
            size: 1024 * 64,
            usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
          });

          this.fluidSimulationBuffer = this.logicalDevice.createBuffer({
            size: 1024 * 1024,
            usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
          });

          this.exposureBuffer = this.logicalDevice.createBuffer({
            size: 256, 
            usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
          });
        }
      }

      async #compileShaderPipelines() {
        const computeShaderSource = `
          struct UniformData {
            resolution: vec2<f32>,
            frame_count: f32,
            time: f32,
            camera_position: vec4<f32>,
            camera_forward_vector: vec4<f32>,
            camera_right_vector: vec4<f32>,
            camera_up_vector: vec4<f32>,
          };

          @group(0) @binding(0) var<uniform> uniform_parameters: UniformData;
          @group(0) @binding(1) var previous_frame_texture: texture_2d<f32>;
          @group(0) @binding(2) var current_frame_texture: texture_storage_2d<rgba32float, write>;
          @group(0) @binding(3) var<storage, read> directed_acyclic_graph_data: array<u32>;
          @group(0) @binding(4) var<storage, read_write> fluid_simulation_data: array<f32>;

          fn permuted_congruential_generator_hash(input_value: u32) -> u32 {
            var state = input_value * 747796405u + 2891336453u;
            var word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
            return (word >> 22u) ^ word;
          }

          fn generate_pseudorandom_float(seed_pointer: ptr<function, u32>) -> f32 {
            *seed_pointer = permuted_congruential_generator_hash(*seed_pointer);
            return f32(*seed_pointer) / 4294967296.0;
          }

          struct RayGeometric { origin: vec3<f32>, direction: vec3<f32> };
          struct IntersectionPoint { distance: f32, position: vec3<f32>, surface_normal: vec3<f32>, surface_albedo: vec3<f32>, is_emissive_material: bool };

          fn compute_sphere_intersection(ray: RayGeometric, sphere_centre: vec3<f32>, sphere_radius: f32, albedo_colour: vec3<f32>, emissive_property: bool) -> IntersectionPoint {
            var intersection: IntersectionPoint; 
            intersection.distance = 1e10;
            let origin_to_centre = ray.origin - sphere_centre;
            let dot_product_b = dot(origin_to_centre, ray.direction);
            let dot_product_c = dot(origin_to_centre, origin_to_centre) - sphere_radius * sphere_radius;
            let discriminant_value = dot_product_b * dot_product_b - dot_product_c;
            
            if (discriminant_value > 0.0) {
              let roots = -dot_product_b - sqrt(discriminant_value);
              if (roots > 0.001) {
                intersection.distance = roots;
                intersection.position = ray.origin + ray.direction * roots;
                intersection.surface_normal = normalize(intersection.position - sphere_centre);
                intersection.surface_albedo = albedo_colour;
                intersection.is_emissive_material = emissive_property;
              }
            }
            return intersection;
          }

          @compute @workgroup_size(8, 8)
          fn compute_kernel_main(@builtin(global_invocation_id) thread_id: vec3<u32>) {
            let output_resolution = vec2<u32>(uniform_parameters.resolution);
            if (thread_id.x >= output_resolution.x || thread_id.y >= output_resolution.y) { return; }

            let stochastic_modifier = directed_acyclic_graph_data[0] + u32(fluid_simulation_data[0]);
            var entropy_seed = thread_id.x + thread_id.y * output_resolution.x + u32(uniform_parameters.frame_count) * 123456u + stochastic_modifier;
            
            let normalised_device_coordinates = (vec2<f32>(f32(thread_id.x), uniform_parameters.resolution.y - f32(thread_id.y)) + vec2(generate_pseudorandom_float(&entropy_seed), generate_pseudorandom_float(&entropy_seed))) / uniform_parameters.resolution;
            let aspect_ratio = uniform_parameters.resolution.x / uniform_parameters.resolution.y;
            let projection_coordinate = (normalised_device_coordinates * 2.0 - 1.0) * vec2(aspect_ratio, 1.0);

            var ray_vector: RayGeometric;
            ray_vector.origin = uniform_parameters.camera_position.xyz;
            ray_vector.direction = normalize(uniform_parameters.camera_forward_vector.xyz * 1.5 + uniform_parameters.camera_right_vector.xyz * projection_coordinate.x + uniform_parameters.camera_up_vector.xyz * projection_coordinate.y);

            var accumulated_radiance = vec3(0.0);
            var attenuation_throughput = vec3(1.0);

            for(var iteration_index = 0; iteration_index < 4; iteration_index++) {
              var nearest_intersection: IntersectionPoint; 
              nearest_intersection.distance = 1e10;
              
              let ground_plane_hit = compute_sphere_intersection(ray_vector, vec3(0.0, -1001.0, 0.0), 1000.0, vec3(0.15), false);
              if(ground_plane_hit.distance < nearest_intersection.distance) { nearest_intersection = ground_plane_hit; }
              let dielectric_sphere_hit = compute_sphere_intersection(ray_vector, vec3(0.0, 1.0, 0.0), 1.0, vec3(0.05, 0.3, 0.9), false);
              if(dielectric_sphere_hit.distance < nearest_intersection.distance) { nearest_intersection = dielectric_sphere_hit; }
              let metallic_sphere_hit = compute_sphere_intersection(ray_vector, vec3(2.5, 0.6, -1.0), 0.6, vec3(0.9, 0.2, 0.1), false);
              if(metallic_sphere_hit.distance < nearest_intersection.distance) { nearest_intersection = metallic_sphere_hit; }
              let spherical_light_source_hit = compute_sphere_intersection(ray_vector, vec3(-6.0, 10.0, 4.0), 2.5, vec3(25.0, 22.0, 18.0), true);
              if(spherical_light_source_hit.distance < nearest_intersection.distance) { nearest_intersection = spherical_light_source_hit; }

              if(nearest_intersection.distance > 1e9) {
                let atmospheric_scattering = mix(vec3(0.002), vec3(0.01, 0.02, 0.04), ray_vector.direction.y * 0.5 + 0.5);
                accumulated_radiance += attenuation_throughput * atmospheric_scattering;
                break;
              }
              if(nearest_intersection.is_emissive_material) {
                accumulated_radiance += attenuation_throughput * nearest_intersection.surface_albedo;
                break;
              }
              
              attenuation_throughput *= nearest_intersection.surface_albedo;
              ray_vector.origin = nearest_intersection.position + nearest_intersection.surface_normal * 0.001;
              
              let uniform_random_u = generate_pseudorandom_float(&entropy_seed);
              let uniform_random_v = generate_pseudorandom_float(&entropy_seed);
              let azimuthal_angle_theta = 2.0 * 3.14159 * uniform_random_u;
              let polar_angle_phi = acos(sqrt(uniform_random_v));
              let orthonormal_w = nearest_intersection.surface_normal;
              let orthonormal_a = select(vec3(0.0, 1.0, 0.0), vec3(1.0, 0.0, 0.0), abs(orthonormal_w.x) > 0.9);
              let orthonormal_u = normalize(cross(orthonormal_a, orthonormal_w));
              let orthonormal_v = cross(orthonormal_w, orthonormal_u);
              
              ray_vector.direction = normalize(orthonormal_u * cos(azimuthal_angle_theta) * sin(polar_angle_phi) + orthonormal_v * sin(azimuthal_angle_theta) * sin(polar_angle_phi) + orthonormal_w * cos(polar_angle_phi));
            }

            let temporal_accumulation = textureLoad(previous_frame_texture, vec2<i32>(thread_id.xy), 0).rgb;
            let integration_weight = 1.0 / (uniform_parameters.frame_count + 1.0);
            textureStore(current_frame_texture, vec2<i32>(thread_id.xy), vec4(mix(temporal_accumulation, accumulated_radiance, integration_weight), 1.0));
          }
        `;

        const rasterisationShaderSource = `
          @group(0) @binding(1) var display_framebuffer: texture_2d<f32>;
          @group(0) @binding(4) var<storage, read> exposure_parameters: array<f32>;

          @vertex
          fn vertex_shader_main(@builtin(vertex_index) vertex_index_id: u32) -> @builtin(position) vec4<f32> {
            var positional_vertices = array<vec2<f32>, 3>(vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
            return vec4(positional_vertices[vertex_index_id], 0.0, 1.0);
          }
          @fragment
          fn fragment_shader_main(@builtin(position) fragment_coordinate: vec4<f32>) -> @location(0) vec4<f32> {
            let hdr_colour = textureLoad(display_framebuffer, vec2<i32>(fragment_coordinate.xy), 0).rgb;
            let coefficient_a = 2.51; let coefficient_b = 0.03; let coefficient_c = 2.43; let coefficient_d = 0.59; let coefficient_e = 0.14;
            let tonemapped_colour = clamp((hdr_colour * (coefficient_a * hdr_colour + coefficient_b)) / (hdr_colour * (coefficient_c * hdr_colour + coefficient_d) + coefficient_e), vec3(0.0), vec3(1.0));
            return vec4(pow(tonemapped_colour, vec3(1.0/2.2)), 1.0);
          }
        `;

        this.computeBindGroupLayout = this.logicalDevice.createBindGroupLayout({
          entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE, texture: { sampleType: 'unfilterable-float' } },
            { binding: 2, visibility: GPUShaderStage.COMPUTE, storageTexture: { access: 'write-only', format: 'rgba32float' } },
            { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
            { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } }
          ]
        });

        this.rasterisationBindGroupLayout = this.logicalDevice.createBindGroupLayout({
          entries: [
            { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'unfilterable-float' } },
            { binding: 4, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } }
          ]
        });

        this.computeShaderPipeline = this.logicalDevice.createComputePipeline({
          layout: this.logicalDevice.createPipelineLayout({ bindGroupLayouts: [this.computeBindGroupLayout] }),
          compute: { module: this.logicalDevice.createShaderModule({ code: computeShaderSource }), entryPoint: 'compute_kernel_main' }
        });

        this.rasterisationPipeline = this.logicalDevice.createRenderPipeline({
          layout: this.logicalDevice.createPipelineLayout({ bindGroupLayouts: [this.rasterisationBindGroupLayout] }),
          vertex: { module: this.logicalDevice.createShaderModule({ code: rasterisationShaderSource }), entryPoint: 'vertex_shader_main' },
          fragment: {
            module: this.logicalDevice.createShaderModule({ code: rasterisationShaderSource }),
            entryPoint: 'fragment_shader_main',
            targets: [{ format: this.textureFormat }]
          },
          primitive: { topology: 'triangle-list' }
        });
      }

      #computeTransformationMatrices() {
        let isMatrixUpdated = false;
        const translationScalar = 0.12;
        const rotationScalar = 0.03;

        if (this.inputState.keyVector['ArrowLeft']) { this.cameraParameters.rotation.azimuthal += rotationScalar; isMatrixUpdated = true; }
        if (this.inputState.keyVector['ArrowRight']) { this.cameraParameters.rotation.azimuthal -= rotationScalar; isMatrixUpdated = true; }
        if (this.inputState.keyVector['ArrowUp']) { this.cameraParameters.rotation.polar = Math.min(1.5, this.cameraParameters.rotation.polar + rotationScalar); isMatrixUpdated = true; }
        if (this.inputState.keyVector['ArrowDown']) { this.cameraParameters.rotation.polar = Math.max(-1.5, this.cameraParameters.rotation.polar - rotationScalar); isMatrixUpdated = true; }

        const forwardVector = {
          x: -Math.sin(this.cameraParameters.rotation.azimuthal) * Math.cos(this.cameraParameters.rotation.polar),
          y: Math.sin(this.cameraParameters.rotation.polar),
          z: -Math.cos(this.cameraParameters.rotation.azimuthal) * Math.cos(this.cameraParameters.rotation.polar)
        };
        const rightVector = { x: Math.cos(this.cameraParameters.rotation.azimuthal), y: 0, z: -Math.sin(this.cameraParameters.rotation.azimuthal) };

        if (this.inputState.keyVector['KeyW']) { this.cameraParameters.position.x += forwardVector.x * translationScalar; this.cameraParameters.position.y += forwardVector.y * translationScalar; this.cameraParameters.position.z += forwardVector.z * translationScalar; isMatrixUpdated = true; }
        if (this.inputState.keyVector['KeyS']) { this.cameraParameters.position.x -= forwardVector.x * translationScalar; this.cameraParameters.position.y -= forwardVector.y * translationScalar; this.cameraParameters.position.z -= forwardVector.z * translationScalar; isMatrixUpdated = true; }
        if (this.inputState.keyVector['KeyA']) { this.cameraParameters.position.x -= rightVector.x * translationScalar; this.cameraParameters.position.z -= rightVector.z * translationScalar; isMatrixUpdated = true; }
        if (this.inputState.keyVector['KeyD']) { this.cameraParameters.position.x += rightVector.x * translationScalar; this.cameraParameters.position.z += rightVector.z * translationScalar; isMatrixUpdated = true; }
        if (this.inputState.keyVector['Space']) { this.cameraParameters.position.y += translationScalar; isMatrixUpdated = true; }
        if (this.inputState.keyVector['ShiftLeft']) { this.cameraParameters.position.y -= translationScalar; isMatrixUpdated = true; }

        if (isMatrixUpdated || this.cameraParameters.isMatrixDirty) {
          this.frameIterationCount = 0;
          this.cameraParameters.isMatrixDirty = false;
        }
      }

      #executeRenderPass(temporalTimestamp) {
        try {
          this.#computeTransformationMatrices();
          const commandEncoder = this.logicalDevice.createCommandEncoder();
          const backBufferIndex = this.frameIterationCount % 2;
          const frontBufferIndex = (this.frameIterationCount + 1) % 2;

          const forwardVector = {
            x: -Math.sin(this.cameraParameters.rotation.azimuthal) * Math.cos(this.cameraParameters.rotation.polar),
            y: Math.sin(this.cameraParameters.rotation.polar),
            z: -Math.cos(this.cameraParameters.rotation.azimuthal) * Math.cos(this.cameraParameters.rotation.polar)
          };
          const rightVector = { x: Math.cos(this.cameraParameters.rotation.azimuthal), y: 0, z: -Math.sin(this.cameraParameters.rotation.azimuthal) };
          const upVector = { x: rightVector.y * forwardVector.z - rightVector.z * forwardVector.y, y: rightVector.z * forwardVector.x - rightVector.x * forwardVector.z, z: rightVector.x * forwardVector.y - rightVector.y * forwardVector.x };

          const uniformDataArray = new Float32Array(32);
          uniformDataArray.set([this.canvasSurface.width, this.canvasSurface.height, this.frameIterationCount, temporalTimestamp / 1000], 0);
          uniformDataArray.set([this.cameraParameters.position.x, this.cameraParameters.position.y, this.cameraParameters.position.z, 0], 4);
          uniformDataArray.set([forwardVector.x, forwardVector.y, forwardVector.z, 0], 8);
          uniformDataArray.set([rightVector.x, rightVector.y, rightVector.z, 0], 12);
          uniformDataArray.set([upVector.x, upVector.y, upVector.z, 0], 16);
          this.logicalDevice.queue.writeBuffer(this.uniformBuffer, 0, uniformDataArray);

          const computeBindGroup = this.logicalDevice.createBindGroup({
            layout: this.computeBindGroupLayout,
            entries: [
              { binding: 0, resource: { buffer: this.uniformBuffer } },
              { binding: 1, resource: this.accumulationTextures[backBufferIndex].createView() },
              { binding: 2, resource: this.accumulationTextures[frontBufferIndex].createView() },
              { binding: 3, resource: { buffer: this.directedAcyclicGraphBuffer } },
              { binding: 4, resource: { buffer: this.fluidSimulationBuffer } }
            ]
          });

          const computePassEncoder = commandEncoder.beginComputePass();
          computePassEncoder.setPipeline(this.computeShaderPipeline);
          computePassEncoder.setBindGroup(0, computeBindGroup);
          computePassEncoder.dispatchWorkgroups(Math.ceil(this.canvasSurface.width / 8), Math.ceil(this.canvasSurface.height / 8));
          computePassEncoder.end();

          const rasterisationPassEncoder = commandEncoder.beginRenderPass({
            colorAttachments: [{
              view: this.renderingContext.getCurrentTexture().createView(),
              clearValue: { r: 0, g: 0, b: 0, a: 1 },
              loadOp: 'clear', storeOp: 'store'
            }]
          });
          
          const rasterisationBindGroup = this.logicalDevice.createBindGroup({
            layout: this.rasterisationBindGroupLayout,
            entries: [
              { binding: 1, resource: this.accumulationTextures[frontBufferIndex].createView() },
              { binding: 4, resource: { buffer: this.exposureBuffer } }
            ]
          });

          rasterisationPassEncoder.setPipeline(this.rasterisationPipeline);
          rasterisationPassEncoder.setBindGroup(0, rasterisationBindGroup);
          rasterisationPassEncoder.draw(3);
          rasterisationPassEncoder.end();

          this.logicalDevice.queue.submit([commandEncoder.finish()]);
          this.frameIterationCount++;
          this.metricSpp.textContent = `Accumulated samples per pixel: ${this.frameIterationCount}`;
          requestAnimationFrame((timestamp) => this.#executeRenderPass(timestamp));
        } catch (exception) {
          this.#throwPipelineException("pipeline execution fault: " + exception.message);
        }
      }

      #throwPipelineException(errorMessage) {
        this.exceptionStackTrace.textContent = errorMessage;
        this.exceptionOverlay.classList.remove('hidden');
      }
    }

    window.onload = () => {
      const targetSurface = document.getElementById('framebuffer-surface');
      const rendererInstance = new WebGpuPathTracingRenderer(targetSurface);
      rendererInstance.initialiseGraphicsContext();
    };
  </script>
</body>
</html>
