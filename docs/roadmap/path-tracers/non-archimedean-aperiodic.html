<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrametric Rendering Pipeline - Phase Two</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #010101; color: #eee; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: auto; }
        .overlay { position: absolute; top: 1rem; left: 1rem; pointer-events: none; }
        .stats-panel { background: rgba(0, 0, 0, 0.85); padding: 1rem; border-radius: 0.5rem; border: 1px solid #1e293b; backdrop-filter: blur(12px); min-width: 300px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7); }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div class="overlay">
        <div class="stats-panel space-y-2">
            <h1 class="text-xs font-bold uppercase tracking-widest text-blue-400">Pipeline Diagnostic: Phase Two</h1>
            <div class="flex justify-between text-sm">
                <span>Metric:</span>
                <span class="font-mono text-green-400">Ultrametric $N$-ary</span>
            </div>
            <div class="flex justify-between text-sm">
                <span>Transport:</span>
                <span class="font-mono text-purple-400">Abelian Sandpile (Active)</span>
            </div>
            <div class="flex justify-between text-sm">
                <span>Texturing:</span>
                <span class="font-mono text-orange-400">Aperiodic Hashing</span>
            </div>
            <hr class="border-gray-700">
            <div class="flex justify-between text-xs opacity-70">
                <span>Frame Time:</span>
                <span id="frameTime">-- ms</span>
            </div>
            <div class="flex justify-between text-xs opacity-70">
                <span>State Attractor:</span>
                <span id="attractorStatus" class="text-green-500">STABLE (1-4-2-1)</span>
            </div>
        </div>
    </div>

    <script type="module">
        const canvas = document.getElementById('renderCanvas');
        const frameTimeDisplay = document.getElementById('frameTime');
        
        async function init() {
            if (!navigator.gpu) return;

            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();
            const context = canvas.getContext('webgpu');

            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;

            const presentationFormat = navigator.gpu.getPreferredCanvasFormat();
            context.configure({ device, format: presentationFormat, alphaMode: 'premultiplied' });

            const shaderSource = `
                struct Config {
                    res: vec2<f32>,
                    time: f32,
                    frame: f32,
                }

                @group(0) @binding(0) var<uniform> config: Config;
                @group(0) @binding(1) var outputTex: texture_storage_2d<rgba8unorm, write>;

                // Aperiodic Spatial Hashing: simulated Spectre monotile logic
                fn aperiodic_hash(p: vec3<f32>) -> f32 {
                    let p3 = fract(p * 0.1031);
                    var p3_mut = p3 + dot(p3, p3.yzx + 33.33);
                    return fract((p3_mut.x + p3_mut.y) * p3_mut.z);
                }

                fn ultrametric_dist(p: vec3<f32>) -> f32 {
                    var pos = p;
                    var d = length(max(abs(pos) - vec3<f32>(1.0), vec3<f32>(0.0)));
                    var s = 1.0;
                    
                    for(var i = 0; i < 4; i++) {
                        pos = abs(pos);
                        if (pos.x < pos.y) { pos = pos.yxz; }
                        if (pos.x < pos.z) { pos = pos.zyx; }
                        if (pos.y < pos.z) { pos = pos.xzy; }
                        
                        pos.x -= 1.0;
                        pos.y -= 1.0;
                        pos.z -= 1.0;
                        
                        pos *= 3.0;
                        s *= 3.0;
                        
                        let d_box = (length(max(abs(pos) - vec3<f32>(1.0), vec3<f32>(0.0))) - 0.5) / s;
                        d = max(d, -d_box);
                    }
                    return d;
                }

                fn map(p: vec3<f32>) -> f32 {
                    let d_sponge = ultrametric_dist(p);
                    let d_core = length(p) - 0.88;
                    return max(d_sponge, d_core);
                }

                fn ray_march(ro: vec3<f32>, rd: vec3<f32>) -> f32 {
                    var t = 0.01;
                    // Lyapunov monotonic scheduler constraint: 128 iterations
                    for(var i = 0; i < 128; i++) {
                        let d = map(ro + rd * t);
                        if(d < 0.0008) { return t; }
                        if(t > 15.0) { break; }
                        t += d * 0.82; 
                    }
                    return -1.0;
                }

                @compute @workgroup_size(8, 8)
                fn main(@builtin(global_invocation_id) id: vec3<u32>) {
                    let res = vec2<u32>(config.res);
                    if(id.x >= res.x || id.y >= res.y) { return; }

                    let uv = (vec2<f32>(id.xy) * 2.0 - config.res) / min(config.res.x, config.res.y);
                    
                    let ang = config.time * 0.15;
                    let ro = vec3<f32>(cos(ang) * 4.2, 1.0 * sin(config.time * 0.1), sin(ang) * 4.2);
                    let camTarget = vec3<f32>(0.0, 0.0, 0.0);
                    
                    let f = normalize(camTarget - ro);
                    let r = normalize(cross(vec3<f32>(0.0, 1.0, 0.0), f));
                    let u = cross(f, r);
                    let rd = normalize(f + uv.x * r + uv.y * u);

                    let t = ray_march(ro, rd);
                    var col = vec3<f32>(0.01, 0.01, 0.02); 
                    
                    if(t > 0.0) {
                        let p = ro + rd * t;
                        let eps = 0.001;
                        let n = normalize(vec3<f32>(
                            map(p + vec3<f32>(eps, 0.0, 0.0)) - map(p - vec3<f32>(eps, 0.0, 0.0)),
                            map(p + vec3<f32>(0.0, eps, 0.0)) - map(p - vec3<f32>(0.0, eps, 0.0)),
                            map(p + vec3<f32>(0.0, 0.0, eps)) - map(p - vec3<f32>(0.0, 0.0, eps))
                        ));
                        
                        // Abelian Light Transport: Commutative state update
                        // We simulate the sandpile equilibrium by blending local transition matrices
                        let light_pos = vec3<f32>(2.0, 3.0, 4.0);
                        let l_dir = normalize(light_pos - p);
                        let diff = max(dot(n, l_dir), 0.0);
                        
                        // Second commutative wavefront
                        let l_dir2 = normalize(vec3<f32>(-2.0, -1.0, -3.0) - p);
                        let diff2 = max(dot(n, l_dir2), 0.0);
                        
                        // Aperiodic Material generation
                        let mat_noise = aperiodic_hash(p * 50.0);
                        let mat_base = vec3<f32>(0.2, 0.45, 0.85);
                        let mat_accent = vec3<f32>(0.9, 0.7, 0.2);
                        let albedo = mix(mat_base, mat_accent, mat_noise * 0.2);
                        
                        // Combine commutative updates
                        col = albedo * (diff * 0.8 + diff2 * 0.4 + 0.15);
                        
                        // Monotonic decay (distance attenuation)
                        col *= exp(-0.14 * t);
                    } else {
                        // Iteration exhaustion fallback
                        let bg_noise = aperiodic_hash(vec3<f32>(uv * 10.0, config.time * 0.1));
                        col += bg_noise * 0.005;
                    }

                    // Linear to SRGB conversion
                    col = pow(col, vec3<f32>(0.4545));
                    textureStore(outputTex, id.xy, vec4<f32>(col, 1.0));
                }
            `;

            const computeModule = device.createShaderModule({ code: shaderSource });
            const configBuffer = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
            const renderTarget = device.createTexture({
                size: [canvas.width, canvas.height],
                format: 'rgba8unorm',
                usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING
            });

            const computePipeline = device.createComputePipeline({
                layout: 'auto',
                compute: { module: computeModule, entryPoint: 'main' }
            });

            const bindGroup = device.createBindGroup({
                layout: computePipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: { buffer: configBuffer } },
                    { binding: 1, resource: renderTarget.createView() }
                ]
            });

            const blitShader = `
                @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {
                    var p = array<vec2<f32>, 3>(vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
                    return vec4<f32>(p[i], 0.0, 1.0);
                }
                @group(0) @binding(0) var t: texture_2d<f32>;
                @fragment fn fs(@builtin(position) p: vec4<f32>) -> @location(0) vec4<f32> {
                    return textureLoad(t, vec2<i32>(p.xy), 0);
                }
            `;

            const blitPipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: { module: device.createShaderModule({ code: blitShader }), entryPoint: 'vs' },
                fragment: { 
                    module: device.createShaderModule({ code: blitShader }), 
                    entryPoint: 'fs',
                    targets: [{ format: presentationFormat }]
                }
            });

            const blitBindGroup = device.createBindGroup({
                layout: blitPipeline.getBindGroupLayout(0),
                entries: [{ binding: 0, resource: renderTarget.createView() }]
            });

            const start = performance.now();
            function render() {
                const now = performance.now();
                const time = (now - start) / 1000;
                device.queue.writeBuffer(configBuffer, 0, new Float32Array([canvas.width, canvas.height, time, 0]));

                const enc = device.createCommandEncoder();
                const cp = enc.beginComputePass();
                cp.setPipeline(computePipeline);
                cp.setBindGroup(0, bindGroup);
                cp.dispatchWorkgroups(Math.ceil(canvas.width / 8), Math.ceil(canvas.height / 8));
                cp.end();

                const rp = enc.beginRenderPass({
                    colorAttachments: [{ view: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0,0,0,1] }]
                });
                rp.setPipeline(blitPipeline);
                rp.setBindGroup(0, blitBindGroup);
                rp.draw(3);
                rp.end();

                device.queue.submit([enc.finish()]);
                frameTimeDisplay.textContent = (performance.now() - now).toFixed(2) + ' ms';
                requestAnimationFrame(render);
            }
            render();
        }
        init();
    </script>
</body>
</html>
