<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mte v3.2: fractional interpolation resolve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020202; color: #a0a0a0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
        canvas { width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 0.75rem; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">
    <div class="max-w-3xl w-full space-y-8">
        <header class="text-center space-y-3">
            <h1 class="text-2xl font-bold text-white tracking-tight">Monistic transport engine: manifold resolve</h1>
            <p class="text-[10px] uppercase tracking-[0.3em] font-mono text-zinc-500">Status: <span id="status" class="text-green-500">active</span> | resolution: <span class="text-blue-400">fractional interpolation</span></p>
        </header>

        <div class="relative bg-zinc-900 p-1.5 rounded-2xl border border-zinc-800">
            <canvas id="manifoldCanvas" width="1024" height="1024"></canvas>
            <div id="errorOverlay" class="absolute inset-0 flex items-center justify-center bg-black/90 hidden rounded-2xl">
                <p class="text-red-400 font-mono text-xs p-10 text-center" id="errorMessage"></p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-[10px] font-mono uppercase tracking-widest text-zinc-500">
            <div class="p-4 bg-zinc-900/50 rounded-lg border border-zinc-800/50">
                <span class="block text-zinc-400 mb-2">Partition identity:</span>
                t = o + u = 1
            </div>
            <div class="p-4 bg-zinc-900/50 rounded-lg border border-zinc-800/50">
                <span class="block text-zinc-400 mb-2">Epoch modulation:</span>
                gen 0.0 – 116.0
            </div>
            <div class="p-4 bg-zinc-900/50 rounded-lg border border-zinc-800/50">
                <span class="block text-zinc-400 mb-2">Spectral blending:</span>
                temporal liquidity pass
            </div>
        </div>
    </div>

    <script type="module">
        /**
         * Implementation: fractional interpolation pass.
         * Resolves temporally fluid transitions between generations by blending adjacent informational states.
         */
        
        function getHalton(index, base) {
            let result = 0;
            let f = 1 / base;
            let i = index;
            while (i > 0) {
                result += f * (i % base);
                i = Math.floor(i / base);
                f /= base;
            }
            return result;
        }

        async function initialiseManifold() {
            const statusEl = document.getElementById('status');
            const errorMsg = document.getElementById('errorMessage');
            const overlay = document.getElementById('errorOverlay');

            if (!navigator.gpu) {
                statusEl.textContent = "unsupported";
                statusEl.className = "text-red-500";
                errorMsg.textContent = "WebGPU support not detected; manifold resolve aborted.";
                overlay.classList.remove('hidden');
                return;
            }

            try {
                const adapter = await navigator.gpu.requestAdapter();
                const device = await adapter.requestDevice();
                const canvas = document.getElementById('manifoldCanvas');
                const context = canvas.getContext('webgpu');
                const format = navigator.gpu.getPreferredCanvasFormat();

                context.configure({ 
                    device, 
                    format, 
                    alphaMode: 'premultiplied',
                    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_DST
                });

                const shaderSource = `
                    struct ManifoldConfig {
                        temporal_index: f32,
                        iterative_generation: f32,
                        golden_ratio: f32,
                        jitter_x: f32,
                        jitter_y: f32,
                        accumulation_weight: f32,
                        padding_a: f32,
                        padding_b: f32,
                    };

                    @group(0) @binding(0) var<uniform> config: ManifoldConfig;
                    @group(0) @binding(1) var history_sampler: sampler;
                    @group(0) @binding(2) var history_texture: texture_2d<f32>;

                    const SPECTRAL_DIM: f32 = 1.3652;

                    /**
                     * Rule 90 vacuum state with generational coordinate scaling.
                     * p_discrete: base coordinates.
                     * depth: current generation (integer).
                     */
                    fn resolveVacuumStateAtDepth(p_discrete: vec3<u32>, depth: u32) -> f32 {
                        // simulate subdivision by shifting coordinates relative to the Planck limit (116).
                        // broadcast the shift amount to a vec3<u32> to satisfy WGSL operator overloads.
                        let shift_amount = 116u - clamp(depth, 0u, 116u);
                        let p_scaled = p_discrete >> vec3<u32>(shift_amount);
                        let state = (p_scaled.x ^ p_scaled.y ^ p_scaled.z) & 1u;
                        return f32(state);
                    }

                    fn resolveSymmetryFold(p_vector: vec3<f32>) -> vec3<f32> {
                        let PHI = config.golden_ratio;
                        let n1 = normalize(vec3<f32>(-0.5, 0.866, 0.0));
                        let n2 = normalize(vec3<f32>(0.5, 0.866, 0.0));
                        let n3 = normalize(vec3<f32>(0.0, 0.5, 0.866 * PHI));
                        var folded = abs(p_vector);
                        for(var i = 0; i < 3; i = i + 1) {
                            folded = folded - 2.0 * min(0.0, dot(folded, n1)) * n1;
                            folded = folded - 2.0 * min(0.0, dot(folded, n2)) * n2;
                            folded = folded - 2.0 * min(0.0, dot(folded, n3)) * n3;
                        }
                        return folded;
                    }

                    fn resolveMetricDistance(p: vec3<f32>, gen_lerp: f32) -> f32 {
                        let folded = resolveSymmetryFold(p);
                        // radius scales from singularity (gen 0) to stable substrate.
                        let radius_base = 0.55;
                        let active_radius = radius_base * smoothstep(0.0, 10.0, gen_lerp);
                        let d_hex = dot(folded, normalize(vec3<f32>(1.0, 1.0, 1.0))) - active_radius;
                        let d_pent = dot(folded, normalize(vec3<f32>(0.0, 0.0, 1.0))) - (active_radius * config.golden_ratio);
                        return max(d_hex, d_pent);
                    }

                    fn resolveLocalCurvature(p: vec3<f32>, gen_lerp: f32) -> f32 {
                        let eps: f32 = 0.004;
                        let center = resolveMetricDistance(p, gen_lerp);
                        let h_xx = (resolveMetricDistance(p + vec3<f32>(eps, 0.0, 0.0), gen_lerp) + resolveMetricDistance(p - vec3<f32>(eps, 0.0, 0.0), gen_lerp) - 2.0 * center) / (eps * eps);
                        let h_yy = (resolveMetricDistance(p + vec3<f32>(0.0, eps, 0.0), gen_lerp) + resolveMetricDistance(p - vec3<f32>(0.0, eps, 0.0), gen_lerp) - 2.0 * center) / (eps * eps);
                        let h_zz = (resolveMetricDistance(p + vec3<f32>(0.0, 0.0, eps), gen_lerp) + resolveMetricDistance(p - vec3<f32>(0.0, 0.0, eps), gen_lerp) - 2.0 * center) / (eps * eps);
                        return abs(h_xx + h_yy + h_zz);
                    }

                    /**
                     * Fractional interpolation pass: blends two generations.
                     */
                    fn resolveInterpolatedRadiance(p_i: vec3<f32>, coord_discrete: vec3<u32>, scale: f32, gen_lerp: f32) -> vec3<f32> {
                        let gen_f = floor(gen_lerp);
                        let gen_c = ceil(gen_lerp);
                        let gen_fract = fract(gen_lerp);

                        // sample adjacent vacuum states.
                        let vac_f = resolveVacuumStateAtDepth(coord_discrete, u32(gen_f));
                        let vac_c = resolveVacuumStateAtDepth(coord_discrete, u32(gen_c));
                        let vacuum = mix(vac_f, vac_c, gen_fract);

                        let eps = 0.01 * scale;
                        let dist0 = resolveMetricDistance(p_i, gen_lerp);
                        let curv = resolveLocalCurvature(p_i, gen_lerp);
                        
                        let pressure = clamp(curv * 0.0015, 0.0, 1.0);
                        let surface = smoothstep(0.005, -0.005, dist0);
                        
                        let entropy = pow(scale, -SPECTRAL_DIM) * vacuum;
                        let rad_base = mix(vec3<f32>(0.4, 0.2, 0.8), vec3<f32>(0.9, 0.7, 1.0), pressure);
                        return rad_base * (1.0 + entropy * 0.4) * surface;
                    }

                    @vertex
                    fn vs_main(@builtin(vertex_index) v_id: u32) -> @builtin(position) vec4<f32> {
                        var pos = array<vec2<f32>, 3>(vec2<f32>(-1.0, -1.0), vec2<f32>(3.0, -1.0), vec2<f32>(-1.0, 3.0));
                        return vec4<f32>(pos[v_id], 0.0, 1.0);
                    }

                    @fragment
                    fn fs_main(@builtin(position) frag_coord: vec4<f32>) -> @location(0) vec4<f32> {
                        let gen = config.iterative_generation;
                        if (gen > 116.5) { return vec4<f32>(1.0, 0.0, 1.0, 1.0); }

                        let jitter = vec2<f32>(config.jitter_x - 0.5, config.jitter_y - 0.5);
                        let uv = (frag_coord.xy + jitter - 512.0) / 512.0;
                        let t_mod = sin(config.temporal_index * 1.5) * 0.4;
                        
                        var ray_pos = vec3<f32>(uv, -2.0 + t_mod);
                        let ray_dir = vec3<f32>(0.0, 0.0, 1.0);
                        var total_dist = 0.0;
                        var hit = false;

                        for(var step: i32 = 0; step < 32; step = step + 1) {
                            let d = resolveMetricDistance(ray_pos, gen);
                            if (d < 0.001) { hit = true; break; }
                            total_dist += d;
                            ray_pos += ray_dir * d;
                            if (total_dist > 4.0) { break; }
                        }

                        var current_color = vec3<f32>(0.005, 0.005, 0.01);
                        if (hit) {
                            var accumulated_radiance = vec3<f32>(0.0);
                            let PHI = config.golden_ratio;
                            let coord_u = vec3<u32>(abs(ray_pos * 512.0));
                            
                            for(var i: i32 = 0; i < 6; i = i + 1) {
                                let scale = pow(PHI, f32(i));
                                let p_i = ray_pos / scale;
                                let rad_i = resolveInterpolatedRadiance(p_i, coord_u, scale, gen);
                                accumulated_radiance += rad_i * (1.0 / scale);
                            }
                            current_color = accumulated_radiance;
                        }
                        
                        let history_uv = frag_coord.xy / 1024.0;
                        let history_color = textureSample(history_texture, history_sampler, history_uv).rgb;
                        let final_color = mix(history_color, current_color, config.accumulation_weight);
                        
                        return vec4<f32>(final_color, 1.0);
                    }
                `;

                const shaderModule = device.createShaderModule({ code: shaderSource });
                const pipeline = device.createRenderPipeline({
                    layout: 'auto',
                    vertex: { module: shaderModule, entryPoint: 'vs_main' },
                    fragment: { module: shaderModule, entryPoint: 'fs_main', targets: [{ format }] }
                });

                const uniformBuffer = device.createBuffer({
                    size: 32,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
                });

                const historyTextures = [0, 1].map(() => device.createTexture({
                    size: [1024, 1024], format,
                    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_SRC
                }));

                const sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
                
                let frameIndex = 0;

                function renderLoop(time) {
                    const t = time * 0.001;
                    const jx = getHalton(frameIndex % 32 + 1, 2);
                    const jy = getHalton(frameIndex % 32 + 1, 3);
                    const weight = frameIndex === 0 ? 1.0 : 0.05;

                    const cycle = (Math.sin(t * 0.2) * 0.5 + 0.5);
                    const targetGen = cycle * 116.0;

                    const configData = new Float32Array([t, targetGen, 1.618034, jx, jy, weight, 0.0, 0.0]);
                    device.queue.writeBuffer(uniformBuffer, 0, configData);

                    const historyInIdx = frameIndex % 2;
                    const historyOutIdx = (frameIndex + 1) % 2;

                    const bindGroup = device.createBindGroup({
                        layout: pipeline.getBindGroupLayout(0),
                        entries: [
                            { binding: 0, resource: { buffer: uniformBuffer } },
                            { binding: 1, resource: sampler },
                            { binding: 2, resource: historyTextures[historyInIdx].createView() }
                        ]
                    });

                    const commandEncoder = device.createCommandEncoder();
                    const renderPass = commandEncoder.beginRenderPass({
                        colorAttachments: [{
                            view: historyTextures[historyOutIdx].createView(),
                            clearValue: { r: 0, g: 0, b: 0, a: 1 },
                            loadOp: 'clear', storeOp: 'store'
                        }]
                    });
                    renderPass.setPipeline(pipeline);
                    renderPass.setBindGroup(0, bindGroup);
                    renderPass.draw(3);
                    renderPass.end();

                    commandEncoder.copyTextureToTexture(
                        { texture: historyTextures[historyOutIdx] },
                        { texture: context.getCurrentTexture() },
                        [1024, 1024]
                    );

                    device.queue.submit([commandEncoder.finish()]);
                    frameIndex++;
                    requestAnimationFrame(renderLoop);
                }

                requestAnimationFrame(renderLoop);

            } catch (err) {
                statusEl.textContent = "fault";
                errorMsg.textContent = err.message;
                overlay.classList.remove('hidden');
            }
        }

        window.onload = initialiseManifold;
    </script>
</body>
</html>
