name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/deploy-docs.yml'

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci

      - uses: quarto-dev/quarto-actions/setup@v2
      
      # We need to run the pre-render script manually or let Quarto do it.
      # Since we defined 'pre-render' in _quarto.yml, Quarto render will call it.
      # But the script is node.js, so we need node installed (which we did).
      
      - name: Render Quarto Project
        run: quarto render
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
