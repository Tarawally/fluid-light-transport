name: Publish Documentation

on:
  push:
    branches: [main, migrate-quarto-to-observable]
    paths:
      - "docs/**"
      - "src/**"
      - ".github/workflows/publish-docs.yml"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Observable site (auto-generates JSDoc & static docs)
        run: |
          npm run docs:api
          npm run docs:build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
